apiVersion: experimental.badstreff.io/v1
kind: NamespaceClass
metadata:
  name: namespaceclass-reader
spec:
  prune: true
  resources:
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: config-reader
      automountServiceAccountToken: false
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: config-reader
      rules:
        - apiGroups: [""]
          resources: ["configmaps"]
          verbs: ["get", "list", "watch"]
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: config-reader
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: config-reader
      subjects:
        - kind: ServiceAccount
          name: config-reader
---
apiVersion: v1
kind: Namespace
metadata:
  name: nsclass-sample-reader
  labels:
    experimental.badstreff.io/namespace-class: namespaceclass-reader
